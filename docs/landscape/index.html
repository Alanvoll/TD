<title>Бой стаи</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; enemy grid on top, yours below, hand and actions at the bottom */
:root{
  --bg:#131C28; --panel:#1A2535; --panel2:#223047; --line:#2F3F58;
  --fg:#EDEFF2; --mut:#9AA3AE; --gold:#E9C46A; --gold-ink:#2A2110;
  --fire:#F0603A; --water:#3A8CF5; --earth:#B98A4E; --air:#8FD8F2; --light:#F7CF5A; --dark:#8A4DF0; --nature:#E6E0D0; --zap:#E2295F;
  --enemy:#D0606F; --ally:#5FB38E; --hit:#FF6B5B; --heal:#7EE08A; --plan:#E9C46A;
  --display:"Unbounded","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;padding-inline:12px;padding-block:10px 24px}
#app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em}
.pill{padding:6px 10px;border-radius:999px;background:var(--panel2);font-size:12px;color:var(--mut)}
.pill.on{background:var(--gold);color:var(--gold-ink);font-weight:600}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.status b{color:var(--fg);font-weight:600}
.side-bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-name{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.pool{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;min-width:0}.side-bar .pool .chip{gap:1px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}

   .d-a{background:var(--air)}
.ei.ei-r{border-radius:50%;transform:scale(.72);background:conic-gradient(var(--fire) 0 12.5%,var(--light) 0 25%,var(--earth) 0 37.5%,var(--nature) 0 50%,var(--air) 0 62.5%,var(--water) 0 75%,var(--dark) 0 87.5%,var(--zap) 0)}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border-radius:12px;background:var(--panel)}
.cell{position:relative;aspect-ratio:1/var(--asp,.9);border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;border:1px solid transparent;overflow:hidden}
.cell.valid{border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.cell.prev{background:color-mix(in srgb,var(--gold) 28%,var(--panel2))}
.cell.planned{box-shadow:inset 0 0 0 2px var(--plan)}
.cell.dest{background:color-mix(in srgb,var(--ally) 30%,var(--panel2));border-color:var(--ally)}
.cell.fl-hit{background:color-mix(in srgb,var(--hit) 55%,var(--panel2))}
.cell.fl-good{background:color-mix(in srgb,var(--heal) 40%,var(--panel2))}
.cell.fl-move{background:color-mix(in srgb,var(--air) 35%,var(--panel2))}
.pns{position:absolute;top:2px;left:2px;display:flex;gap:1px;z-index:3;pointer-events:none}.pn{min-width:13px;height:13px;border-radius:7px;background:var(--gold);color:#131C28;font-size:9px;font-weight:800;line-height:13px;text-align:center;box-shadow:0 1px 2px #0008}
.pet{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:2px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;border:2px solid transparent}

.cell.sel .av{box-shadow:0 0 0 3px var(--gold)}
.pname{font-size:9px;color:var(--mut);white-space:nowrap;line-height:1}
.hp{width:86%;height:5px;border-radius:3px;background:#0C121B;overflow:hidden}
.hp i{display:block;height:100%;background:var(--ally)}
.enemyg .hp i{background:var(--enemy)}
.hpn{font-size:9px;font-variant-numeric:tabular-nums;line-height:1}

.bd{font-size:9px;font-weight:700;padding:0 3px;border-radius:4px}
.bd.st{background:#2A2F45;padding:0 1px}
.bd.au{background:#3E5A4C;color:#CFEFDD}
.bd.sh{background:#5A6C86} .bd.fr{background:#7FC3E8;color:#0C1A26}
.grid{background:radial-gradient(120% 90% at 50% 0%,#1F3A2E 0%,var(--panel) 70%)}
.grid.enemyg{background:radial-gradient(120% 90% at 50% 100%,#3A2230 0%,var(--panel) 70%)}
.cell{background:radial-gradient(90% 80% at 50% 35%,#26354A 0%,var(--panel2) 75%)}
.cell .av{box-shadow:0 3px 0 #0006;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.cell .av.shd{box-shadow:0 0 0 3px #7FB8FF88,0 0 10px 2px #7FB8FF66,0 3px 0 #0006}
.cell .av.frz{filter:saturate(.4) brightness(1.15);box-shadow:0 0 0 3px #BFE8FF,0 0 12px #BFE8FFAA}
.cell.shk{animation:shk .35s ease-in-out}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.trap{animation:tp 1.4s ease-in-out infinite}
@keyframes tp{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
.card:not(.dis):not(.pl):not(.burned){box-shadow:0 0 0 1px color-mix(in srgb,var(--pc) 35%,transparent),0 4px 10px #0005}
.card.new{animation:cin .35s ease-out backwards}
@keyframes cin{from{transform:translateY(24px) scale(.85);opacity:0}}
#fxl{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fxl .fx-pj{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;box-shadow:0 0 10px 4px currentColor;background:#fff}
#fxl .fx-num{position:absolute;transform:translate(-50%,-50%);font:800 22px var(--display,sans-serif);text-shadow:0 2px 0 #000,0 0 6px #000}
#fxl .fx-pt{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%}
#fxl .ban{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);padding:8px 14px;border-radius:12px;background:#131C28EE;border:1px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap;display:flex;gap:6px;align-items:center}
#fxl .ban.op{border-color:var(--enemy)}#fxl .ban.me{border-color:var(--ally)}
#fxl .fx-gh{position:absolute;transform:translate(-50%,-50%);font-size:26px}
.cell.big{aspect-ratio:auto}.cell.big .av{width:72px;height:72px;font-size:46px}.cell.big .hp{width:70%}
.weak{position:absolute;transform:translate(-50%,-50%);font-size:22px;color:#FFD36B;text-shadow:0 0 8px #FFB000,0 0 2px #000;animation:tp 1.2s ease-in-out infinite;pointer-events:none}
/* 0.32.1: the preview sits at the top as a chip, so the health bar under it stays readable */
.fx{position:absolute;top:3px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-weight:700;font-size:11px;line-height:15px;padding:0 4px;border-radius:8px;background:#131C28E0;z-index:4;pointer-events:none}
.fx.bad{color:#FFB0A6} .fx.good{color:var(--heal)} .fx.info{color:var(--fg)}
.front{text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.hand.wide{grid-template-columns:repeat(4,1fr)}
.cell,.card{-webkit-touch-callout:none}
.cell{touch-action:pan-y}.cell.drg{touch-action:none}
.cell.lt{border-top:2px solid #5FD39A}.cell.lb{border-bottom:2px solid #5FD39A}.cell.ll{border-left:2px solid #5FD39A}.cell.lr{border-right:2px solid #5FD39A}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--mut,#9AA3AE);padding:2px 4px}.legend b{color:#CFEFDD;font-weight:700}
.card{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;padding:5px 5px 6px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--pc);min-height:128px;min-width:0;touch-action:none;user-select:none;-webkit-user-select:none}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:20;opacity:.95;box-shadow:0 10px 24px #000a}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:2px}

.shape{display:inline-grid;grid-template-columns:repeat(3,5px);gap:1px;flex:none}.shape i{width:5px;height:5px;background:#3A4B66;border-radius:1px}.shape i.b{background:var(--hit)}.shape i.g{background:var(--heal)}.shape.m5{grid-template-columns:repeat(5,5px)}.shape.m5 i{width:5px;height:5px}.shape i.o{background:#EDEFF2}.shape i.bf,.mgrid i.bf{background:var(--hit);opacity:.35}

.burnzone{border:1.5px dashed var(--line);border-radius:12px;padding:22px 10px;font-size:13px!important;text-align:center;font-size:12px;color:var(--mut)}
.burnfix{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:40;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:700;color:var(--gold);background:color-mix(in srgb,var(--bg) 88%,transparent);border-top:2px dashed var(--gold);pointer-events:none}
.burnfix.hit{background:color-mix(in srgb,var(--gold) 28%,var(--bg));color:#fff;border-top-style:solid}
.burnfix[hidden]{display:none}
.burnzone.over{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.card.burned{opacity:.45;border-style:dashed}
.burntag{position:absolute;top:-7px;right:-3px;font-size:9px;font-weight:700;padding:1px 4px;border-radius:5px;background:var(--gold);color:var(--gold-ink)}
.trap{position:absolute;bottom:2px;left:3px;font-size:11px;font-weight:700;color:var(--gold)}
.sil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.4;pointer-events:none}
.sil.pl{opacity:.55}
.cell.ghostc{outline:2px dashed var(--ally);outline-offset:-3px}
.cell.prev.dest{background:color-mix(in srgb,var(--ally) 55%,var(--panel2))}
.hot{position:fixed;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid var(--gold);border-radius:50%;pointer-events:none;z-index:21;box-shadow:0 0 0 2px #0008}
.ghost{transform-origin:center}




.bigcard{border-top:4px solid var(--pc)}
.pk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pt{position:relative;background:var(--panel2);border-radius:12px;padding:8px 2px 6px;text-align:center;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
.pt.on{border-color:var(--gold)}
.pt .em{font-size:30px;line-height:1}.pt .num{position:absolute;top:3px;left:6px;font-weight:700;color:var(--gold)}
.pcard{background:var(--panel2);border-radius:10px;padding:7px 9px;margin-top:6px;border-left:3px solid var(--pc)}
.pcard .h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700}
.mgrid{display:grid;gap:3px;max-width:220px}
.mgrid i{aspect-ratio:1;border-radius:4px;background:var(--bg)}
.mgrid i.b{background:var(--hit)}.mgrid i.f{outline:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:10px;background:var(--panel2)}
.sec h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.ei.rr{width:14px;height:14px;margin:0 1px}
.ei.rg{width:13px;height:13px;margin:0 1px}
.c-cost{gap:2px;align-items:center}
.piles{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pilegrid{grid-template-columns:repeat(4,1fr)}

body{user-select:none;-webkit-user-select:none}
.card.selc{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel2))}
.card.pl{border-color:var(--plan);opacity:.75}
.card.dis{opacity:.38}

.c-cost{display:flex;gap:3px;flex-wrap:wrap;font-size:10px}




.badge{position:absolute;top:-6px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--plan);color:var(--gold-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.detail{background:var(--panel);border-radius:10px;padding:9px 11px;min-height:58px;font-size:13px;line-height:1.4}
.detail h3{margin:0 0 3px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m,.detail .m{color:var(--mut)}
.acts{display:flex;gap:8px}
.btn{flex:1;padding:12px;border-radius:12px;background:var(--panel2);font-weight:600}
.btn.main{background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.log{background:var(--panel2);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.55;color:var(--mut);max-height:60vh;overflow:auto}
.log b{color:var(--fg);font-weight:500}
.log .me{color:#BFE6D2} .log .op{color:#F2B9C0}
.over{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.box{background:var(--panel);border-radius:16px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto}
.box h2{margin:0;font-family:var(--display);font-size:20px}
.box ul{margin:0;padding-left:18px;line-height:1.5;color:var(--mut)}
.box li b{color:var(--fg);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v26 animations + field */
.em{display:inline-block;transform-origin:50% 85%;animation:br 2.6s ease-in-out infinite;will-change:transform}
@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.94)}}
@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes fl{0%,100%{transform:translateY(1px)}50%{transform:translateY(-3px) rotate(3deg)}}
@keyframes fli{0%,100%{transform:scale(1)}40%{transform:scale(1.07,.95)}}
.av.low .em{animation-duration:1.1s;filter:saturate(.7)}
.av.slw .em{animation-duration:6s}
.av.stn .em{animation:dz 1s linear infinite}
@keyframes dz{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}
.av.stn::after{content:'💫';position:absolute;top:-10px;font-size:11px;animation:orb 1.2s linear infinite}
@keyframes orb{from{transform:rotate(0) translateX(12px) rotate(0)}to{transform:rotate(360deg) translateX(12px) rotate(-360deg)}}
.av{position:relative}
.av.frz .em,.av.dead .em{animation:none}
.av.hurt .em{animation:hurt .45s ease-out}
@keyframes hurt{0%{transform:scale(1.25,.75);filter:brightness(2.2) saturate(0)}40%{transform:scale(.9,1.1);filter:sepia(1) saturate(6) hue-rotate(-40deg)}100%{transform:none;filter:none}}
.av.glad .em{animation:glad .6s ease-out}
@keyframes glad{0%{transform:translateY(0)}35%{transform:translateY(-7px) scale(1.1)}70%{transform:translateY(0) scale(.95,1.05)}100%{transform:none}}
.av.glad{box-shadow:0 0 0 3px #7EE08A88,0 0 12px #7EE08A88}
/* field: chess-like tiles, terrain glow */
.grid{position:relative;border:1px solid #2B3B52;box-shadow:inset 0 0 30px #0007}
.grid:not(.enemyg){background:radial-gradient(130% 100% at 50% 0%,#24493A 0%,#18301F 45%,#121D26 100%)}
.grid.enemyg{background:radial-gradient(130% 100% at 50% 100%,#4A2A3C 0%,#2A1A2C 45%,#121D26 100%)}
.grid .cell{background:linear-gradient(160deg,#ffffff10,#00000018),#1E2D40;box-shadow:inset 0 -3px 0 #0005,inset 0 1px 0 #ffffff12}
.grid:not(.enemyg) .cell.dk{background:linear-gradient(160deg,#ffffff0c,#00000020),#192A2C}
.grid.enemyg .cell.dk{background:linear-gradient(160deg,#ffffff0c,#00000020),#291F33}
.grid .cell.dest{background:color-mix(in srgb,var(--ally) 30%,#1E2D40)}
.grid .cell.prev{background:color-mix(in srgb,var(--gold) 30%,#1E2D40)}
.grid .cell.fl-hit{background:color-mix(in srgb,var(--hit) 55%,#1E2D40)}
.grid .cell.fl-good{background:color-mix(in srgb,var(--heal) 40%,#1E2D40)}
.grid .cell.fl-move{background:color-mix(in srgb,var(--air) 35%,#1E2D40)}
.grid .cell .av{box-shadow:0 4px 0 #0006,0 6px 10px #0005}
.cell .shadow{position:absolute;bottom:22%;width:26px;height:6px;border-radius:50%;background:#0006;filter:blur(1px)}
.front{position:relative;height:28px;display:flex;align-items:center;justify-content:center}
.front::before{content:'';position:absolute;left:4%;right:4%;top:50%;height:2px;background:linear-gradient(90deg,transparent,#E9C46A88,#E9C46A,#E9C46A88,transparent);box-shadow:0 0 8px #E9C46A88}
.front span{position:relative;background:var(--bg);padding:0 8px}
.front.q{height:28px;padding:0}
.qs{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;width:100%;padding:3px 4%;box-sizing:border-box}
.qs::-webkit-scrollbar{display:none}.qs>:first-child{margin-left:auto}.qs>:last-child{margin-right:auto}
.qc{flex:none;display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 7px 0 5px;border-radius:10px;background:var(--panel);border:1px solid var(--ally);font-size:11px;letter-spacing:0;text-transform:none;color:var(--fg);white-space:nowrap;transition:opacity .25s}
.qc.op{border-color:var(--enemy)}.qc b{font-size:9px;color:var(--mut);font-weight:600;margin-right:1px}.qc i{font-style:normal}
.qc.dn,.qc.mv{padding:0 5px;font-size:10px}.qc.dn{background:var(--bg);border-style:dashed}
.qc.done{opacity:.3}.qc.cur{border-color:var(--gold);box-shadow:0 0 8px #E9C46Aaa;background:var(--panel2)}

@keyframes mote{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}80%{opacity:.7}100%{opacity:0;transform:translate(14px,-40px)}}

.tm{display:flex;gap:6px;align-items:center;margin:6px 0}.ts{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}.ts.empty{color:var(--mut);font-size:16px}
.flt{display:flex;flex-direction:column;gap:5px;margin:8px 0}.pill.sm{padding:4px 8px;font-size:11px}
.pk{grid-template-columns:repeat(5,1fr)!important;gap:5px!important}.pt{padding:6px 1px 4px!important;font-size:10px!important}.pt .em{font-size:26px!important}.pnm{white-space:nowrap;font-size:10px;letter-spacing:-.02em;max-width:100%;overflow:hidden}

.grid.field::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:0;background:radial-gradient(40% 55% at 20% 30%,#9FE0B514,transparent 70%),radial-gradient(35% 50% at 80% 70%,#FFE9A812,transparent 70%);animation:amb 9s ease-in-out infinite alternate;will-change:opacity}
.grid.enemyg.field::before{background:radial-gradient(40% 55% at 25% 65%,#E2A6FF12,transparent 70%),radial-gradient(35% 50% at 75% 25%,#FFB0D010,transparent 70%);}
@keyframes amb{from{opacity:.45}to{opacity:1}}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:8px}.mi{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.mi.main{background:color-mix(in srgb,var(--gold) 16%,var(--panel));border-color:var(--gold)}.mi b{display:block;font-size:15px;margin-bottom:2px}.mi .m{font-size:12px}.mic{font-size:28px}
.draft{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:12px;background:var(--panel2);margin-top:6px;border:1px solid var(--line)}
.fbar{font-size:12px;padding:6px 8px;border-radius:10px;background:#2A2236;border:1px solid #4A3A5C}
.over .acts{display:flex;gap:8px;justify-content:center}
.lvb{position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#131C28;border-radius:6px;padding:0 4px}.modes.scr{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}.modes.scr::-webkit-scrollbar{display:none}.modes.scr .pill{white-space:nowrap;flex:none}
.acts.stk{position:sticky;bottom:0;padding:8px 0 4px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}

/* v30: pets fit inside cells and animate without clipping */
.grid .cell{overflow:visible;min-width:0}.grid .cell .pet{min-width:0;overflow:visible}.grid .cell.occ{z-index:1}.grid .cell .pet{gap:1px;padding:0}.grid .cell .av{width:32px;height:32px}.grid .cell .hp{height:9px;width:80%}.grid .cell .hpn{position:relative;margin-top:-10px;font-size:8px;line-height:9px;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}.grid .cell .pname{line-height:10px}

function phaseClick(e){
  const a=e.target.closest('[data-qt],[data-act],[data-view],[data-pick],[data-pcell]');if(!a)return;
  const tog=v=>{if(TEAM.includes(v))TEAM=TEAM.filter(x=>x!==v);else if(TEAM.length<TN){if(teamElsOk([...TEAM,v]))TEAM.push(v);else toast(CAP_MSG)}};
  if(a.dataset.qt!=null){if(!a.disabled)tog(+a.dataset.qt);return render()}
  if(a.dataset.view!=null){ui.pv=+a.dataset.view;ui.psheet=true;return render()}
  if(a.dataset.pick!=null){const v=+a.dataset.pick;ui.pv=v;if(TEAM.includes(v))TEAM=TEAM.filter(x=>x!==v);else if(TEAM.length<TN){if(teamElsOk([...TEAM,v]))TEAM.push(v);else toast(CAP_MSG)};return render()}

    if(ui.ps==null){if(i>=0)ui.ps=i}else{if(i>=0&&i!==ui.ps)PLACE[i]=PLACE[ui.ps];if(i!==ui.ps)PLACE[ui.ps]=[r,c];ui.ps=null}
    return render()}
  const act=a.dataset.act;
  if(act&&modeClick(act))return;
  if(act&&act.startsWith('ai-')){AI=act.slice(3);render()}
  else if(act==='vs-pack'||act==='vs-boss'){VS=act.slice(3);render()}

function subTexts(s){
  if(s.shield)return['щит '+s.shield+' себе','Пет получает щит '+s.shield+'.'];
  if(s.heal)return['+'+s.heal+' здоровья себе','Пет лечится на '+s.heal+'.'];
  if(s.colDmg)return[s.colDmg+' урона ближайшему в столбце',s.colDmg+' урона ближайшему врагу в столбце этого пета.'];
  if(s.frontDmg)return[s.frontDmg+' урона по фронту',s.frontDmg+' урона всем врагам в переднем ряду.'];
  if(s.allShield)return['щит '+s.allShield+' всем','Все свои получают щит '+s.allShield+'.'];
  if(s.allHeal)return['+'+s.allHeal+' здоровья всем','Все свои лечатся на '+s.allHeal+'.'];
  if(s.draw)return['рука +1','Лимит руки +1 на следующий ход.'];
  if(s.markCol)return['метка ближайшему','Метка на '+s.markCol+' хода ближайшему врагу в столбце.'];
  if(s.evade)return['уклонение себе','Пет уклоняется от первого удара в этом ходу.'];
  return['',''];
}

// builds T entries for a template (variant per element when the cost has '*')
function mkCard(spec){
  const[base,e0]=spec.split('@'),tp=CT[base];if(!tp)throw new Error('no card '+base);
  const wild=tp.cost&&tp.cost['*'];if(wild&&!e0)throw new Error('no element for '+spec);
  const el=wild?e0:tp.el,key='x_'+(wild?base+'@'+el:base);if(!el)throw new Error('card without element '+base);
  if(!T[key]){const cost={};for(const c in tp.cost)cost[c==='*'?el:c]=tp.cost[c];
    const t={...tp,cost,base,el,dg:el,n:(tp.nv&&tp.nv[el])||tp.n};delete t.nv;
    t.sub=tp.sub?{...SB[tp.sub]}:null;if(t.sub){const[a,b]=subTexts(t.sub);t.sub.short=a;t.sub.txt=b}else delete t.sub;
    if(!sumv(cost))cost[el]=1; // no free ▲: a card that had no cost now takes 1 of its own element
    t.burn=sumv(cost)>=2?1:2;T[key]=t}
  return key}

function cheat(k){const all=PETS.map(p=>p.n);
  if(k==='lairs'){for(const b of Object.keys(BOSSES))lairOf(b).t=Math.max(lairOf(b).t,2);saveMeta();toast('👑 Все сложности Логов открыты.');chOk('lairs');render();return}
  if(k==='rkup'){const R=rk();R.pts+=300;R.best=Math.max(R.best,R.pts);saveMeta();toast('🏆 +300 очков Лиги.');chOk('rkup');render();return}
  if(k==='cdx'){const c=cdx();for(const[s]of CDX_TABS)for(const x of cdxList(s))c[s][x.k]=1;saveMeta();toast('📖 Кодекс открыт.');chOk('cdx');render();return}
  if(k==='exp'){const code=btoa(unescape(encodeURIComponent(JSON.stringify(META))));
    try{navigator.clipboard.writeText(code).then(()=>{toast('📤 Сохранение скопировано. Вставь его на другом устройстве.');render()},()=>askYes('Скопируй код сохранения:','Готово',()=>{},1,code))}catch(e){askYes('Скопируй код сохранения:','Готово',()=>{},1,code)}return}
  if(k==='imp'){askYes('Вставь код сохранения:','📥 Загрузить',code=>{if(!code)return;
    try{const m=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!m||!m.pets)throw 0;META=m;ensureMeta();saveMeta();G={phase:'menu'};ui.cheat=false;toast('📥 Сохранение загружено.');render()}catch(e){toast('Код не подошёл.');render()}},1);return}
  if(k==='st')META.stones+=500;
  if(k==='fr')for(const n of all)giveFr(n,50);
  if(k==='un')for(const n of all)mp(n).un=true;
  if(k==='lv')for(const n of all){const m=mp(n);if(m.un){m.lv=Math.max(m.lv,QNEED[m.q]||MAXLV);m.xp=0}}
  if(k==='q')for(const n of all){const m=mp(n);if(m.un&&m.q<4)m.q++}
  if(k==='max')for(const n of all){const m=mp(n);m.un=true;m.q=4;m.lv=25;m.xp=0}
  if(k==='alt')for(const n of all){const m=mp(n);if(m.un&&m.q<3){m.q=3;m.lv=Math.max(m.lv,15)}}
  if(k==='qr')for(const q of questsToday())q.p=QDEF[q.k].g;
  if(k==='sand')META.cheat.sand=!META.cheat.sand;
  if(k==='asc')META.asc=10;
  if(k==='reset'){askYes('Сбросить весь прогресс? Это нельзя отменить.','🗑 Сбросить',()=>{try{localStorage.removeItem(META_KEY)}catch(e){}loadMeta();ensureMeta();saveMeta();CTX=null;G={phase:'menu'};ui.cheat=false;ui.set=false;toast('🗑 Прогресс сброшен.');render()});return}
  if(G&&G.phase==='battle'&&!G.over){
    ui.set=false;ui.cheat=false;
    if(k==='win'){G.B.pets.forEach(p=>{p.alive=false;p.hp=0});checkOver()}
    if(k==='lose'){G.P.pets.forEach(p=>{p.alive=false;p.hp=0});checkOver()}
    if(k==='heal')for(const p of alive(G.P))p.hp=p.max;
    if(k==='el')for(const e of ELS)G.P.pool[e]+=5;
  }
  if(META.run&&typeof runCheat==='function')runCheat(k);
  const MSG={st:'💎 +500 камней.',fr:'🧩 +50 осколков всем.',un:'🔓 Все существа открыты.',lv:'⬆ Уровни подняты до нужных для качества.',q:'⭐ Качество +1 всем.',max:'👑 Всё на максимуме.',alt:'🃏 Вторые карты открыты.',qr:'📋 Задания выполнены.',sand:META.cheat.sand?'🧪 Песочница включена.':'🧪 Песочница выключена.',asc:'🔺 Все уровни сложности открыты.',win:'🏆 Победа.',lose:'💀 Поражение.',heal:'💚 Свои вылечены.',el:'✨ +5 всех стихий.',gold:'🪙 +200 золота.',life:'❤ +1 жизнь.',skip:'⏭ Точка пропущена.',talis:'🔮 Талисман добавлен.',act:'🗺 Следующий акт.'};
  if(MSG[k])toast(MSG[k]);chOk(k);saveMeta();render()}

function mirrorTeam(idx){const own=TEAM.map(i=>mp(PETS[i].n));if(!own.length)return idx;
  const lv=Math.round(own.reduce((a,m)=>a+m.lv,0)/own.length),q=Math.round(own.reduce((a,m)=>a+m.q,0)/own.length);
  return idx.map(i=>typeof i==='object'?i:metaDef(i,lv,q,[0,1,2].map(()=>Math.random()<.5?1:0)))}

let LASTE=null;document.addEventListener('click',e=>{LASTE=e},true);
const bgHit=act=>!LASTE||(LASTE.target&&LASTE.target.dataset&&LASTE.target.dataset.act===act);
function toast(t){ui.toast=t;ui.toastT=Date.now()}
function metaClick(act){
  if(act==='m-cheat'){ui.cheat=true;render();return true}
  if(act==='ch-x'||act==='ch-close'){if(act==='ch-x'||bgHit(act)){ui.cheat=false;render()}return true}
  if(act.startsWith('ch-')){cheat(act.slice(3));return true}
  if(act.startsWith('qc-')){const l=questClaim(+act.slice(3));if(l)toast(l.map(x=>x.k==='st'?'💎 +'+x.v:x.k==='fr'?'🧩 +'+x.v+' '+x.n:x.k==='new'?'✨ '+x.n+' открыт!':'').join(' · '));render();return true}
  if(G.phase!=='lib')return false;
  if(act.startsWith('lf-')){LIBF.show=act.slice(3);render();return true}
  if(act.startsWith('lfam-')){LIBF.fam=act.slice(5)||null;render();return true}
  if(act.startsWith('ls-')){LIBF.sort=act.slice(3);render();return true}
  if(act.startsWith('lib-')&&act!=='lib-shop'){ui.lp=+act.slice(4);ui.lq=null;render();return true}
  if(act.startsWith('lq-')){ui.lq=+act.slice(3);render();return true}
  if(act==='lp-x'||act==='lp-close'){if(act==='lp-x'||bgHit(act)){ui.lp=null;render()}return true}
  if(act.startsWith('sl-')){const[i,j,v]=act.slice(3).split('-').map(Number),m=mp(PETS[i].n);if(m.un&&(v===0||altOpen(m.q,j))){m.sl[j]=v;saveMeta()}render();return true}
  if(act.startsWith('qup-')){const p=PETS[+act.slice(4)];if(qUp(p.n)){ui.lq=null;toast(`${p.n}: качество ${QN[mp(p.n).q]}!`)}render();return true}
  if(act==='lib-shop'){ui.shop=true;render();return true}
  if(act==='sh-x'||act==='sh-close'){if(act==='sh-x'||bgHit(act)){ui.shop=false;render()}return true}
  if(act.startsWith('buy-')){const o=shopToday()[+act.slice(4)];if(o&&!o.b&&META.stones>=o.cost){META.stones-=o.cost;o.b=true;const l=[];giveFr(o.n,o.fr,l);if(l.some(x=>x.k==='new'))toast('✨ '+o.n+' теперь в библиотеке!');saveMeta()}render();return true}
  return false}

function upOffer(R,ex){const l=[];R.team.forEach((m,mi)=>m.cards.forEach((k,ci)=>{if(!/\+$/.test(k)&&!ex.some(o=>o.mi===mi&&o.ci===ci))l.push({k:'up',mi,ci})}));return l.length?l[Math.floor(Math.random()*l.length)]:null}
function petOffer(R,ex){const inT=new Set(R.team.map(m=>m.pi).concat(ex.filter(o=>o.k==='pet').map(o=>o.pi)));
  const own=PETS.map((p,i)=>i).filter(i=>mp(PETS[i].n).un&&!inT.has(i)),lock=PETS.map((p,i)=>i).filter(i=>!mp(PETS[i].n).un&&!inT.has(i));
  const guest=!own.length||Math.random()<.3&&lock.length;const l=guest?lock:own;if(!l.length)return null;return{k:'pet',pi:l[Math.floor(Math.random()*l.length)],guest:!!guest}}

function rewardSet(kind){const R=META.run,o=[],n=3+(hasTR('clover')?1:0);
  const push=x=>{if(x)o.push(x)};
  if(kind==='elite'||kind==='boss'){for(let i=0;i<n;i++)push(talOffer(R,o,kind==='boss'?1:0));if(R.team.length<5)push(petOffer(R,o))}
  else{if(R.team.length<5)push(petOffer(R,o));while(o.length<n){const x=Math.random();push(x<.12?talOffer(R,o):x<.24&&R.team.length<5?petOffer(R,o):upOffer(R,o));if(o.length<n&&Math.random()<.02)break}}
  if(R.forecast){R.forecast=0;push(upOffer(R,o))}
  if(kind==='fight'&&Math.random()<.4){const a=altOffer(R,o);if(a){const k=o.findIndex(x=>x.k==='up');if(k>=0)o[k]=a;else o.push(a)}}

function runLeave(){const R=META.run;if(!R)return;const nd=R.pos&&R.map.rows[R.pos.r][R.pos.i];if(nd)nd.done=true;

function runNextAct(R){if(R.act>=ACTS.length-1){R.result='win';R.scr='end';return}

function runEnter(r,i){const R=META.run,nd=R.map.rows[r][i];R.pos={r,i};questEv('node');saveMeta();

  else if(nd.k==='camp'){R.scr='camp';R.campUp=null}
  else if(nd.k==='shop'){if(!R.shop)R.shop=shopGen(R);R.scr='shop'}
  else if(nd.k==='treasure'){if(!R.offers){const a=talOffer(R,[]),b=a&&talOffer(R,[a]);R.offers=[a,b].filter(Boolean)}R.scr='treasure'}

  if(!G||G.phase!=='run'&&G.phase!=='battle'&&G.phase!=='place')return false;
  const R=META.run;

    if(act==='run-rw'){R.rwLog=G.rw;const b=R.evBonus;if(b){if(b.gold2){const g=(G.rw||[]).find(x=>x.k==='gold');if(g){R.gold+=g.v;R.rwLog=[...R.rwLog,{k:'gold',v:g.v}]}}if(b.tal!=null){const o=talOffer(R,R.offers||[],b.tal);if(o)(R.offers=R.offers||[]).unshift(o)}}}
    R.evBonus=null;CTX=null;G={phase:'run'};saveMeta();render();return true}

  if(G.phase!=='run')return false;

/* ---------- «Стратег» bot. Builds many different plans (which cards go ▲, which go ▼, which stay in hand, who steps where),

const SMART={cands:26,s1:4,top:0,s2:8,depth:0,w:{alive:4,el:1,elcap:14,hand:.35,front:.3,thr:1,sh:.6}};const SW=SMART.w;

function smartSide(S,O){let v=0;

    const hp=p.ghost?0:p.hp;v+=(hp+Math.min(p.shield,shCap(p))*SW.sh)*(p.ghost?0:1)+(p.ghost?(p.down?3:1)*K:SW.alive*K*(1+(w-1)*SW.thr));
    if(p.st)v-=(p.st.stun||0)*1.5*K+(p.st.burn||0)*.9*K+(p.st.slow?.4*K:0)+(p.st.root?.3*K:0)+(p.st.mark?.7*K:0)-(p.st.evade?.6*K:0)-(p.st.immune?.4*K:0);if(p.frozen)v-=1.5*K;

function smartSim(me,ser,w,depth,cache){const save=G,su={...ui},R0=Math.random;G=structuredClone(save);SIMU=true;

    return smartEval(me)}

  const ctx={dmg:new Map()},firsts=[];
  for(const card of S.hand){if(whyNot(S,card))continue;let b=null;
    for(const opt of botOptions(S,O,card)){const sc=hardScore(S,O,card,opt,ctx);if(!b||sc>b.sc)b={card,opt,sc}}
    if(b&&b.sc>0)firsts.push(b)}

/* ----- 0.38.0: the battle screen fits the phone screen and never scrolls -----

function layOver(){const r=app.getBoundingClientRect(),pb=parseFloat(getComputedStyle(document.body).paddingBottom)||0;return Math.ceil(r.bottom+pb-innerHeight)}
// 0.41.10: the fit is searched again only when the screen size or the set of rows changed (or it no longer fits);

let layFitK='',layFitN=0;
function layFit(on){const B=document.body;
  if(!on){layFitK='';if(B.dataset.bfit){delete B.dataset.bfit;delete B.dataset.hcl;delete B.dataset.tight;B.style.removeProperty('--bw');B.style.removeProperty('--hz')}return}
  const hd=app.querySelector('.hand.mini'),k=[innerWidth,innerHeight,typeof TN!=='undefined'?TN:5,LAY,hd?hd.children.length:0,[...app.children].map(e=>e.className).filter(c=>!/^(over|toast|detail)\b|\bnt-tip\b/.test(c)).join('|')].join('/');
  if(k===layFitK&&B.dataset.bfit&&layOver()<=0)return;
  layFitK=k;layFitN++;{const hz=app.querySelector('.hand.mini');if(hz)hz.style.zoom=''}
  B.dataset.bfit=1;delete B.dataset.tight;B.style.removeProperty('--hz');B.dataset.tn=typeof TN!=='undefined'?TN:5;
  const bd=app.querySelector('.board'),refit=()=>{if(bd&&typeof fitBoard==='function')fitBoard()};

  const squeeze=minW=>{let o=layOver();if(o<=0)return true;if(!bd)return false;const h=bd.getBoundingClientRect().height;if(!(h>0))return false;
    // the tilted board's height shrinks a bit slower than its width, so step down until it fits
    let w=Math.floor(100*(h-o-2)/h);for(let k=0;k<6;k++){if(w<minW)return false;B.style.setProperty('--bw',w+'%');refit();o=layOver();if(o<=0)return true;w-=Math.max(2,Math.ceil(100*o/h))}return false};
  // larger cards first: 150 px, then 126 px, then the usual size; the board gives way down to 78 % before the cards shrink
  // 0.38.6 Anton: the fan overlaps cards, so they can be bigger still: an extra 182 px size, and the board may give way a little more

  if(innerHeight<=700){delete B.dataset.hcl;B.style.removeProperty('--bw');for(const z of [1,.92,.85,.8]){if(z<1)B.style.setProperty('--hz',z);refit();if(layOver()<=0)return}

   (lit from the top-left, a few faint rubbed spots that differ per card), no drawn scratches */
function libInk(i){const h=libBgHash(PETS[i].n+'#fr');
  return`<span class="lcd-ink" style="--wa:${12+h%76}%;--wb:${14+(h>>>7)%72}%;--wc:${10+(h>>>14)%80}%"></span><span class="lcd-ink2"></span>`}

/* Anton 21:38: in the creature window the creature's cards look strange: show them exactly as the cards in battle
   (the same ▲ top / ▼ bottom card from the hand), drawn for this creature at its level, with the name under it */
let LSL=null;

  try{LSL={un:m.un,S:mkSide(false,[{...PETS[i],lv:m.lv,q:m.q,pi:i}],[[0,0]]),E:mkSide(true,[PETS[i]],[[0,0]])}}catch(e){LSL=null}
  try{return ls0(i)}finally{LSL=null}}}
if(typeof cardMini==='function'){const cm0=cardMini;cardMini=function(k,p,lock,on,act){
  if(!LSL||typeof cardHtml!=='function')return cm0(k,p,lock,on,act);
  const G0=G;let h='';
  try{G={phase:'battle',P:LSL.S,E:LSL.E,turn:1};h=cardHtml({uid:'L'+k,t:k,pet:LSL.S.pets[0].id},true)}catch(e){h=''}finally{G=G0}
  if(!h)return cm0(k,p,lock,on,act);
  h=h.replace(/ data-card="[^"]*"/,'').replace(/ (disu|disd)\b/g,'').replace(/<span class="why">.*?<\/span>/,'').replace('<button','<div').replace(/<\/button>\s*$/,'</div>');
  const qn=lock?(lock.match(/«(.+?)»/)||[])[1]:'',lq=QN.indexOf(qn),qp=qn?qn.replace(/(ый|ий)$/,'ом'):'';
  const st=lock?`<span class="lc-lock" style="color:${lq>=0?qC(lq):'var(--mut)'}">🔒 на «${qp}»</span>`:!LSL.un?(on?'<span class="lc-on lc-off">стартовая</span>':''):on?'<span class="lc-on">✓ в колоде</span>':'<span class="lc-on lc-pick">тапни — в колоду</span>';
  return`<button class="lslc ${on?'on':''} ${lock?'lk':''} ${LSL.un?'':'un'}" ${act&&!lock?`data-act="${act}"`:''}><div class="lsl-w"><div class="hand mini lsl-h">${h}</div>${lock?'<span class="lsl-lki">🔒</span>':''}</div><span class="lsl-n">${T[k].n}</span>${st}</button>`}}

if(typeof document!=="undefined"&&document.body){const st=document.createElement("style");st.id="night";st.textContent="/* ===== Ночь (2026-10-15, тред «Ночная переработка интерфейса»): one look for every screen, after V2_battle.png.\n   Dark-blue bevelled stone, one night scene behind every screen, dark glass HUD pills, gold only for the one main action.\n   CSS only, nothing moves on idle screens, no blur. Backgrounds never depend on elements or quality. ===== */\n:root{\n  --nt-sky0:#070B16;--nt-sky1:#0E1628;--nt-sky2:#16213A;\n  --nt-stone:#263147;--nt-stone-hi:#34415C;--nt-stone-edge:#4A5A78;--nt-stone-lo:#1A2234;--nt-stone-sh:#080C16;\n  --nt-p0:#111A2B;--nt-p1:#1C2639;--nt-p2:#26324A;--nt-p3:#31405D;\n  --nt-glass:rgba(10,15,28,.9);--nt-line:rgba(160,185,230,.14);--nt-line2:rgba(160,185,230,.24);\n  --nt-t1:#F1F4FA;--nt-t2:#B8C3D6;--nt-t3:#8E9AB2;--nt-ink:#2A1A05;\n  --nt-gold:#F2C35B;--nt-gold-hi:#FFE6A3;--nt-gold-lo:#C98B26;--nt-gold-dk:#7A4E12;\n  --nt-danger:#E5484D;--nt-success:#46C37B;--nt-dot:#FF3B47;\n  --bg:var(--nt-sky1);--panel:var(--nt-p1);--panel2:var(--nt-p2);--line:#33415E;--fg:var(--nt-t1);--mut:var(--nt-t2);--gold:var(--nt-gold);--gold-ink:var(--nt-ink);\n}\n\n/* --- one night scene behind every screen (static) --- */\nhtml{background:var(--nt-sky0)}\nbody{background:transparent}\nbody::before{content:\"\";position:fixed;inset:0;z-index:-1;pointer-events:none;\n  background:\n    radial-gradient(40% 22% at 80% 7%,rgba(207,224,255,.16) 0%,rgba(207,224,255,.05) 45%,transparent 70%),\n    radial-gradient(120% 40% at 50% 100%,rgba(40,58,100,.5) 0%,transparent 70%),\n    radial-gradient(95% 65% at 50% 38%,transparent 55%,rgba(3,5,12,.7) 100%),\n    linear-gradient(180deg,rgba(7,11,22,.62),rgba(7,11,22,.5) 55%,rgba(7,11,22,.62)),\n    #070B16 var(--nt-scn,linear-gradient(180deg,var(--nt-sky0) 0%,var(--nt-sky1) 38%,var(--nt-sky2) 72%,#10182A 100%)) center top/cover no-repeat}\n\n/* --- top bar: back button always top-left, title centred, counters ri
